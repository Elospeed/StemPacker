# Release erstellen: ein Klick statt ZIP von Hand bauen und hochladen.
#
# So geht's: Actions -> "Release erstellen" -> Run workflow -> Version eintragen
# (z. B. 0.2, ohne "v"). Vorher muss auf main schon alles für diese Version
# drin sein (APP_VER, .lpi, LIESMICH/README.txt, CHANGELOG-Abschnitt
# "## <Version> – ..."; tools/versionen-pruefen.sh prüft das).
#
# Was passiert:
# 1. Prüfen: Version passt, Tag gibt es noch nicht.
# 2. StemPacker bauen wie in build.yml, ZIP mit tools/release-zip.sh.
# 3. Release v<Version> anlegen: Text = CHANGELOG-Abschnitt + SHA-256, ZIP dran.
#    Kein Ko-fi- oder Spendenhinweis im Release-Text (Regel seit 2.11.2026).

name: Release erstellen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 0.2"
        required: true

permissions:
  contents: write   # Release anlegen und ZIP hochladen

concurrency:
  group: release
  cancel-in-progress: false

env:
  LAZARUS_VERSION: "3.8"

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Version prüfen
        # Version kommt über eine Umgebungsvariable ins Skript, nicht direkt per ${{ }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION=$(printf '%s' "$VERSION" | tr -d ' \r')
          VERSION="${VERSION#v}"
          echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)+$' || { echo "::error::Version '$VERSION' ist keine Versionsnummer wie 0.2"; exit 1; }
          APP=$(sed -n "s/^ *APP_VER *= *'\([0-9.]*\)';.*/\1/p" src/packerform.pas | head -n 1 | tr -d '\r')
          [ "$APP" = "$VERSION" ] || { echo "::error::src/packerform.pas hat APP_VER '$APP', nicht '$VERSION'"; exit 1; }
          tools/versionen-pruefen.sh
          if gh release view "v$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION gibt es schon"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Lazarus installieren
        # gleicher gepinnter Commit wie in build.yml (= Tag v3.4.1)
        uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe # v3.4.1
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: false

      - name: Exe bauen, verkleinern, ZIP bauen
        run: |
          set -e
          lazbuild -B --os=win64 --cpu=x86_64 --ws=win32 src/StemPacker.lpi
          mkdir -p ausgabe
          cp bin/StemPacker.exe ausgabe/
          STRIP=$(find /c/lazarus -iname strip.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$STRIP" ]; then STRIP=$(command -v strip || true); fi
          [ -n "$STRIP" ] || { echo "::error::strip.exe nicht gefunden"; exit 1; }
          "$STRIP" ausgabe/StemPacker.exe
          bash tools/release-zip.sh ausgabe/StemPacker.exe ausgabe
          ZIP="ausgabe/StemPacker-$VERSION.zip"
          [ -f "$ZIP" ] || { echo "::error::$ZIP fehlt"; ls -l ausgabe; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "ZIPSHA=$(sha256sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Release anlegen und ZIP hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Release-Text: der CHANGELOG-Abschnitt dieser Version (ohne Überschrift)
          python - "$VERSION" > notizen.md <<'PY'
          import sys
          v = sys.argv[1]
          zeilen = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          drin, aus = False, []
          for z in zeilen:
              if z.startswith('## '):
                  if drin:
                      break
                  drin = z.startswith('## ' + v + ' ')
                  continue
              if drin:
                  aus.append(z)
          sys.stdout.reconfigure(encoding='utf-8')
          print('\n'.join(aus).strip())
          PY
          {
            echo
            echo "English: see the [README](https://github.com/$REPO#readme) and the [project page](https://elospeed.github.io/StemPacker/)."
            echo
            echo "Alle Änderungen / All changes: [CHANGELOG](https://github.com/$REPO/blob/main/CHANGELOG.md)"
            echo
            echo "SHA-256 \`$(basename "$ZIP")\`: \`$ZIPSHA\`"
          } >> notizen.md
          gh release create "v$VERSION" "$ZIP" --repo "$REPO" \
            --target "$GITHUB_SHA" --title "StemPacker $VERSION" --notes-file notizen.md --latest

      - name: Zusammenfassung
        run: |
          {
            echo "### Release v$VERSION angelegt"
            echo "SHA-256 \`$(basename "$ZIP")\`: \`$ZIPSHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
